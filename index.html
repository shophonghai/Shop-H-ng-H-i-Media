<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạp Hóa Shop - Mega Digital Marketplace</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           BIẾN CSS & RESET
           ========================================== */
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a2e;
            --bg-header: rgba(10, 10, 15, 0.95);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b80;
            --neon-blue: #00d4ff;
            --neon-purple: #a855f7;
            --neon-pink: #ec4899;
            --gradient-main: linear-gradient(135deg, #00d4ff 0%, #a855f7 50%, #ec4899 100%);
            --gradient-btn: linear-gradient(90deg, #00d4ff, #a855f7);
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --shadow-glow: 0 0 20px rgba(0, 212, 255, 0.3);
            --font-family: 'Inter', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg-dark: #f5f5f7;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f0f5;
            --bg-header: rgba(255, 255, 255, 0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #555570;
            --text-muted: #8888a0;
            --border-color: rgba(0, 0, 0, 0.08);
            --glass-bg: rgba(0, 0, 0, 0.03);
            --shadow-glow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        img { max-width: 100%; display: block; }
        button { cursor: pointer; font-family: inherit; border: none; outline: none; }
        input, select, textarea { font-family: inherit; outline: none; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--gradient-main); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-blue); }

        /* ==========================================
           UTILITY CLASSES
           ========================================== */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .gap-10 { gap: 10px; }
        .gap-20 { gap: 20px; }
        .text-gradient {
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        .btn-primary {
            background: var(--gradient-btn);
            color: #fff;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 212, 255, 0.5); }
        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-outline:hover { border-color: var(--neon-blue); color: var(--neon-blue); background: rgba(0, 212, 255, 0.05); }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }
        .btn-success { background: #10b981; color: #fff; }
        .btn-success:hover { background: #059669; }
        .btn-sm { padding: 8px 16px; font-size: 0.85rem; }
        .btn-xs { padding: 4px 10px; font-size: 0.75rem; }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-hot { background: linear-gradient(135deg, #ef4444, #f97316); color: #fff; }
        .badge-new { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
        .badge-sale { background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff; }

        /* Glassmorphism */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
        }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-sm);
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* ==========================================
           HEADER & NAVIGATION
           ========================================== */
        .top-bar {
            background: var(--gradient-main);
            color: #fff;
            padding: 8px 0;
            font-size: 0.85rem;
            overflow: hidden;
            white-space: nowrap;
        }
        .top-bar .marquee {
            display: inline-block;
            animation: marquee 25s linear infinite;
        }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            gap: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 800;
            white-space: nowrap;
        }
        .logo i { color: var(--neon-blue); font-size: 1.8rem; }

        /* Search Bar */
        .search-container {
            flex: 1;
            max-width: 600px;
            position: relative;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 8px 8px 20px;
            transition: var(--transition);
        }
        .search-box:focus-within { border-color: var(--neon-blue); box-shadow: var(--shadow-glow); }
        .search-box i { color: var(--text-muted); margin-right: 10px; }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box .btn-search {
            background: var(--gradient-btn);
            color: #fff;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .search-suggestions {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            max-height: 400px;
            overflow-y: auto;
            display: none;
            z-index: 1001;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .search-suggestions.active { display: block; }
        .suggestion-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .suggestion-item:hover { background: var(--bg-card-hover); }
        .suggestion-item img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
        .suggestion-item .info { flex: 1; }
        .suggestion-item .info h4 { font-size: 0.9rem; font-weight: 500; }
        .suggestion-item .info p { font-size: 0.8rem; color: var(--text-muted); }

        /* Header Actions */
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .action-btn {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            font-size: 1.1rem;
        }
        .action-btn:hover { border-color: var(--neon-blue); color: var(--neon-blue); box-shadow: var(--shadow-glow); }
        .action-btn .count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--neon-pink);
            color: #fff;
            font-size: 0.65rem;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .theme-toggle { background: var(--bg-card); }

        /* Mobile Menu Button */
        .mobile-menu-btn { display: none; }

        /* ==========================================
           MAIN LAYOUT & SIDEBAR
           ========================================== */
        .main-wrapper { display: flex; gap: 0; min-height: calc(100vh - 120px); }

        .sidebar {
            width: 260px;
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            padding: 20px 0;
            flex-shrink: 0;
            overflow-y: auto;
            height: calc(100vh - 70px);
            position: sticky;
            top: 70px;
            transition: var(--transition);
        }
        .sidebar-category { padding: 0 15px; }
        .sidebar-category h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 10px;
            padding-left: 10px;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .sidebar-item:hover, .sidebar-item.active { background: var(--glass-bg); color: var(--neon-blue); }
        .sidebar-item i { width: 20px; text-align: center; font-size: 1rem; }
        .sidebar-item .arrow { margin-left: auto; font-size: 0.7rem; }

        .content-area { flex: 1; padding: 30px; min-width: 0; }

        /* ==========================================
           HOME PAGE SECTIONS
           ========================================== */
        .section { margin-bottom: 40px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-header h2 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .section-header h2 i { color: var(--neon-blue); }
        .section-header .view-all { font-size: 0.9rem; color: var(--neon-blue); cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .section-header .view-all:hover { text-decoration: underline; }

        /* Hero Banner */
        .hero-banner {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            height: 350px;
            background: var(--gradient-main);
            display: flex;
            align-items: center;
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: var(--shadow-glow);
        }
        .hero-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></svg>');
            background-size: 100px;
            opacity: 0.3;
        }
        .hero-content { position: relative; z-index: 1; max-width: 600px; }
        .hero-content h1 { font-size: 2.8rem; font-weight: 800; color: #fff; line-height: 1.2; margin-bottom: 15px; }
        .hero-content p { color: rgba(255,255,255,0.9); font-size: 1.1rem; margin-bottom: 25px; }
        .hero-content .btn { background: #fff; color: var(--bg-dark); font-weight: 700; }
        .hero-content .btn:hover { background: #f0f0f0; transform: scale(1.05); }

        /* Category Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .category-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px 15px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }
        .category-card:hover { transform: translateY(-5px); border-color: var(--neon-blue); box-shadow: var(--shadow-glow); }
        .category-card i { font-size: 2rem; margin-bottom: 10px; color: var(--neon-blue); }
        .category-card span { font-size: 0.85rem; font-weight: 500; display: block; }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }
        .product-card:hover { transform: translateY(-5px); border-color: var(--neon-purple); box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2); }
        .product-card .img-wrapper { position: relative; height: 160px; overflow: hidden; background: var(--bg-card-hover); }
        .product-card .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .product-card:hover .img-wrapper img { transform: scale(1.1); }
        .product-card .badges { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 5px; }
        .product-card .wishlist-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .product-card .wishlist-btn:hover { background: var(--neon-pink); }
        .product-card .wishlist-btn.active { background: var(--neon-pink); color: #fff; }
        .product-card .info { padding: 15px; }
        .product-card .info .category-tag { font-size: 0.7rem; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .product-card .info h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-card .info .price-row { display: flex; align-items: center; gap: 10px; }
        .product-card .info .price { font-size: 1.1rem; font-weight: 700; color: var(--neon-blue); }
        .product-card .info .old-price { font-size: 0.85rem; color: var(--text-muted); text-decoration: line-through; }
        .product-card .info .rating { display: flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 0.8rem; color: var(--text-secondary); }
        .product-card .info .rating i { color: #fbbf24; }

        /* Flash Sale */
        .flash-sale-bar {
            background: linear-gradient(90deg, #ef4444, #f97316);
            border-radius: var(--radius-md);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #fff;
        }
        .flash-sale-bar h3 { font-size: 1.3rem; font-weight: 700; }
        .flash-sale-bar .countdown { display: flex; gap: 10px; align-items: center; font-weight: 700; }
        .flash-sale-bar .countdown span { background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 6px; }

        /* ==========================================
           PRODUCT DETAIL PAGE
           ========================================== */
        .product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .product-gallery .main-img { width: 100%; height: 400px; border-radius: var(--radius-md); overflow: hidden; margin-bottom: 15px; background: var(--bg-card); }
        .product-gallery .main-img img { width: 100%; height: 100%; object-fit: cover; }
        .product-gallery .thumbnails { display: flex; gap: 10px; }
        .product-gallery .thumbnails img { width: 80px; height: 80px; border-radius: var(--radius-sm); cursor: pointer; object-fit: cover; border: 2px solid transparent; transition: var(--transition); }
        .product-gallery .thumbnails img.active, .product-gallery .thumbnails img:hover { border-color: var(--neon-blue); }

        .product-info-detail h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 10px; }
        .product-info-detail .meta { display: flex; gap: 20px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
        .product-info-detail .price-box { background: var(--bg-card); padding: 20px; border-radius: var(--radius-md); margin-bottom: 20px; border: 1px solid var(--border-color); }
        .product-info-detail .price-box .current-price { font-size: 2rem; font-weight: 800; color: var(--neon-blue); }
        .product-info-detail .price-box .old-price { font-size: 1.1rem; color: var(--text-muted); text-decoration: line-through; margin-left: 10px; }
        .product-info-detail .price-box .discount { color: var(--neon-pink); font-weight: 700; margin-left: 10px; }
        .product-info-detail .actions { display: flex; gap: 15px; margin-bottom: 20px; }
        .product-info-detail .actions .btn { flex: 1; }
        .product-info-detail .actions .wishlist-large { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); padding: 12px 20px; border-radius: var(--radius-sm); }
        .product-info-detail .actions .wishlist-large.active { background: var(--neon-pink); border-color: var(--neon-pink); color: #fff; }

        /* Tabs */
        .tabs { margin-top: 40px; }
        .tab-headers { display: flex; gap: 5px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .tab-btn { padding: 12px 24px; background: transparent; color: var(--text-secondary); font-weight: 600; border-bottom: 2px solid transparent; transition: var(--transition); }
        .tab-btn.active { color: var(--neon-blue); border-bottom-color: var(--neon-blue); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ==========================================
           CART PAGE
           ========================================== */
        .cart-layout { display: grid; grid-template-columns: 1fr 380px; gap: 30px; }
        .cart-item { display: flex; gap: 15px; padding: 15px; background: var(--bg-card); border-radius: var(--radius-md); margin-bottom: 15px; border: 1px solid var(--border-color); }
        .cart-item img { width: 100px; height: 100px; border-radius: var(--radius-sm); object-fit: cover; }
        .cart-item .info { flex: 1; }
        .cart-item .info h4 { font-size: 1rem; margin-bottom: 5px; }
        .cart-item .info .price { color: var(--neon-blue); font-weight: 700; }
        .cart-item .qty-controls { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .cart-item .qty-controls button { width: 30px; height: 30px; border-radius: 6px; background: var(--bg-card-hover); color: var(--text-primary); border: 1px solid var(--border-color); }
        .cart-item .qty-controls span { width: 30px; text-align: center; font-weight: 600; }

        .cart-summary { background: var(--bg-card); padding: 25px; border-radius: var(--radius-md); border: 1px solid var(--border-color); height: fit-content; position: sticky; top: 100px; }
        .cart-summary h3 { margin-bottom: 20px; font-size: 1.2rem; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; color: var(--text-secondary); }
        .summary-row.total { font-size: 1.2rem; font-weight: 700; color: var(--text-primary); border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 15px; }
        .summary-row.total .price { color: var(--neon-blue); }

        /* ==========================================
           AUTH MODAL
           ========================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 35px;
            width: 100%;
            max-width: 420px;
            position: relative;
            animation: modalSlide 0.3s;
        }
        @keyframes modalSlide { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; color: var(--text-muted); font-size: 1.3rem; transition: var(--transition); }
        .modal-close:hover { color: var(--text-primary); }
        .modal-content h2 { text-align: center; margin-bottom: 25px; font-size: 1.5rem; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--neon-blue); box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1); }
        .auth-switch { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-secondary); }
        .auth-switch span { color: var(--neon-blue); cursor: pointer; font-weight: 600; }

        /* ==========================================
           ADMIN DASHBOARD
           ========================================== */
        .admin-layout { display: grid; grid-template-columns: 240px 1fr; gap: 0; min-height: 100vh; }
        .admin-sidebar {
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            padding: 20px 0;
        }
        .admin-sidebar .logo { padding: 0 20px 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        .admin-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
        }
        .admin-nav-item:hover, .admin-nav-item.active { background: var(--glass-bg); color: var(--neon-blue); border-left: 3px solid var(--neon-blue); }
        .admin-content { padding: 30px; overflow-y: auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-card); padding: 25px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }
        .stat-card .icon { width: 50px; height: 50px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-bottom: 15px; }
        .stat-card .value { font-size: 1.8rem; font-weight: 800; }
        .stat-card .label { font-size: 0.85rem; color: var(--text-muted); }

        table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: var(--radius-md); overflow: hidden; }
        th, td { padding: 15px 20px; text-align: left; font-size: 0.9rem; border-bottom: 1px solid var(--border-color); }
        th { background: var(--bg-card-hover); color: var(--text-secondary); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        tr:hover td { background: var(--bg-card-hover); }

        /* ==========================================
           TOAST NOTIFICATIONS
           ========================================== */
        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: toastSlide 0.3s;
        }
        @keyframes toastSlide { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        .toast.success { border-left: 4px solid #10b981; }
        .toast.error { border-left: 4px solid #ef4444; }
        .toast.info { border-left: 4px solid var(--neon-blue); }
        .toast i { font-size: 1.2rem; }
        .toast.success i { color: #10b981; }
        .toast.error i { color: #ef4444; }
        .toast.info i { color: var(--neon-blue); }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 1200px) {
            .cart-layout { grid-template-columns: 1fr; }
            .product-detail { grid-template-columns: 1fr; }
        }
        @media (max-width: 992px) {
            .sidebar { display: none; }
            .mobile-menu-btn { display: flex; }
            .admin-layout { grid-template-columns: 1fr; }
            .admin-sidebar { display: none; }
        }
        @media (max-width: 768px) {
            .header-inner { flex-wrap: wrap; }
            .search-container { order: 3; max-width: 100%; flex-basis: 100%; }
            .hero-content h1 { font-size: 1.8rem; }
            .hero-banner { height: 250px; padding: 25px; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
            .product-card .img-wrapper { height: 120px; }
            .section-header h2 { font-size: 1.2rem; }
            .content-area { padding: 15px; }
            .top-bar { font-size: 0.75rem; }
            .logo span { display: none; }
        }
        @media (max-width: 480px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .product-card .info { padding: 10px; }
            .product-card .info h4 { font-size: 0.8rem; }
            .product-card .info .price { font-size: 0.95rem; }
            .hero-content h1 { font-size: 1.4rem; }
            .hero-content p { font-size: 0.9rem; }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- ==========================================
         TOAST CONTAINER
         ========================================== -->
    <div id="toast-container"></div>

    <!-- ==========================================
         TOP BAR
         ========================================== -->
    <div class="top-bar">
        <div class="marquee">
            <i class="fas fa-bolt"></i> Chào mừng đến với Tạp Hóa Shop - Siêu thị số #1 Việt Nam! Giảm giá 50% cho tất cả tài khoản game mới. <i class="fas fa-gift"></i> Miễn phí vận chuyển kỹ thuật số toàn quốc!
        </div>
    </div>

    <!-- ==========================================
         HEADER
         ========================================== -->
    <header>
        <div class="container header-inner">
            <div class="logo" onclick="app.navigate('home')">
                <i class="fas fa-bolt"></i>
                <span>Tạp Hóa <span class="text-gradient">Shop</span></span>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="global-search" placeholder="Tìm kiếm sản phẩm, game, dịch vụ..." autocomplete="off">
                    <button class="btn-search" onclick="app.search()">Tìm</button>
                </div>
                <div class="search-suggestions" id="search-suggestions"></div>
            </div>

            <div class="header-actions">
                <button class="action-btn mobile-menu-btn" onclick="app.toggleSidebar()"><i class="fas fa-bars"></i></button>
                <button class="action-btn" onclick="app.showWishlist()"><i class="fas fa-heart"></i><span class="count" id="wishlist-count">0</span></button>
                <button class="action-btn" onclick="app.navigate('cart')"><i class="fas fa-shopping-cart"></i><span class="count" id="cart-count">0</span></button>
                <button class="action-btn theme-toggle" onclick="app.toggleTheme()"><i class="fas fa-moon" id="theme-icon"></i></button>
                <button class="action-btn" onclick="app.showAuthModal()" id="user-btn"><i class="fas fa-user"></i></button>
                <button class="action-btn" onclick="app.navigate('admin')" title="Admin Demo"><i class="fas fa-cog"></i></button>
            </div>
        </div>
    </header>

    <!-- ==========================================
         MAIN APP CONTAINER
         ========================================== -->
    <div id="app-root"></div>

    <!-- ==========================================
         AUTH MODAL
         ========================================== -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="app.closeAuthModal()"><i class="fas fa-times"></i></button>
            <div id="auth-form-container"></div>
        </div>
    </div>

    <!-- ==========================================
         PRODUCT QUICK VIEW MODAL (Reused for detail)
         ========================================== -->
    <div class="modal-overlay" id="quickview-modal">
        <div class="modal-content" style="max-width:800px;" id="quickview-content">
            <!-- Dynamic content -->
        </div>
    </div>

    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->
    <script>
        // ==========================================
        // MOCK DATA GENERATOR & STORAGE
        // ==========================================
        const DB = {
            users: JSON.parse(localStorage.getItem('thshop_users')) || [],
            currentUser: JSON.parse(localStorage.getItem('thshop_currentUser')) || null,
            products: [],
            categories: [],
            cart: JSON.parse(localStorage.getItem('thshop_cart_' + (JSON.parse(localStorage.getItem('thshop_currentUser'))?.email || 'guest'))) || [],
            wishlist: JSON.parse(localStorage.getItem('thshop_wishlist_' + (JSON.parse(localStorage.getItem('thshop_currentUser'))?.email || 'guest'))) || [],
            orders: JSON.parse(localStorage.getItem('thshop_orders')) || [],
            walletBalance: JSON.parse(localStorage.getItem('thshop_wallet_' + (JSON.parse(localStorage.getItem('thshop_currentUser'))?.email || 'guest'))) || 500000,
            viewedProducts: JSON.parse(localStorage.getItem('thshop_viewed_' + (JSON.parse(localStorage.getItem('thshop_currentUser'))?.email || 'guest'))) || []
        };

        // Save cart/wishlist based on current user context
        const saveUserData = () => {
            const userKey = DB.currentUser ? DB.currentUser.email : 'guest';
            localStorage.setItem('thshop_cart_' + userKey, JSON.stringify(DB.cart));
            localStorage.setItem('thshop_wishlist_' + userKey, JSON.stringify(DB.wishlist));
            localStorage.setItem('thshop_viewed_' + userKey, JSON.stringify(DB.viewedProducts));
            localStorage.setItem('thshop_wallet_' + userKey, JSON.stringify(DB.walletBalance));
            localStorage.setItem('thshop_users', JSON.stringify(DB.users));
            localStorage.setItem('thshop_currentUser', JSON.stringify(DB.currentUser));
            localStorage.setItem('thshop_orders', JSON.stringify(DB.orders));
        };

        // Generate thousands of mock products dynamically
        const generateMockProducts = () => {
            const gameCategories = [
                'Liên Quân Mobile', 'Free Fire', 'PUBG Mobile', 'Valorant', 'Liên Minh Huyền Thoại',
                'Genshin Impact', 'Honkai: Star Rail', 'Wuthering Waves', 'Minecraft', 'Roblox',
                'Steam Game', 'Epic Games', 'PlayStation', 'Xbox', 'Nintendo', 'Đột Kích'
            ];
            const socialServices = ['Facebook', 'TikTok', 'YouTube', 'Instagram', 'Telegram', 'Discord', 'X (Twitter)'];
            const digitalServices = ['Thiết kế Logo', 'Thiết kế Website', 'Hosting', 'Domain', 'VPS', 'Cloud', 'Phần mềm', 'Chỉnh sửa Video'];
            const cardProviders = ['Viettel', 'Vinaphone', 'Mobifone', 'Vietnamobile', 'Garena', 'Zing', 'Steam Wallet', 'Google Play', 'App Store'];
            
            let id = 1;
            const products = [];

            // Game accounts
            gameCategories.forEach(game => {
                for (let i = 0; i < 15; i++) {
                    products.push({
                        id: id++,
                        name: `Tài khoản ${game} - ${['Full Skin', 'Rank Cao', 'Full Tướng', 'VIP', 'Cày Cuốc'][i % 5]} #${i + 1}`,
                        category: game,
                        type: 'account',
                        price: Math.floor(Math.random() * 5000000) + 50000,
                        oldPrice: Math.floor(Math.random() * 7000000) + 500000,
                        discount: Math.floor(Math.random() * 50) + 10,
                        image: `https://picsum.photos/seed/game${id}/400/300`,
                        rating: (Math.random() * 2 + 3).toFixed(1),
                        sold: Math.floor(Math.random() * 500) + 10,
                        stock: Math.floor(Math.random() * 50) + 1,
                        description: `Tài khoản ${game} cực chất lượng, full vật phẩm, rank cao. Bảo hành trọn đời, hỗ trợ đổi mật khẩu.`,
                        badges: i % 3 === 0 ? ['hot'] : i % 3 === 1 ? ['new'] : ['sale']
                    });
                }
            });

            // Game top-up / giftcards
            cardProviders.forEach(provider => {
                for (let i = 0; i < 8; i++) {
                    products.push({
                        id: id++,
                        name: `Thẻ ${provider} ${[10000, 20000, 50000, 100000, 200000, 500000, 1000000][i % 7]}đ`,
                        category: 'Thẻ cào',
                        type: 'card',
                        price: [10000, 20000, 50000, 100000, 200000, 500000, 1000000][i % 7] * 0.95,
                        oldPrice: [10000, 20000, 50000, 100000, 200000, 500000, 1000000][i % 7],
                        discount: 5,
                        image: `https://picsum.photos/seed/card${id}/400/300`,
                        rating: (Math.random() * 2 + 3).toFixed(1),
                        sold: Math.floor(Math.random() * 1000) + 50,
                        stock: 999,
                        description: `Thẻ ${provider} mệnh giá ${[10000, 20000, 50000, 100000, 200000, 500000, 1000000][i % 7]}đ. Giao ngay qua email.`,
                        badges: ['hot']
                    });
                }
            });

            // Social services
            socialServices.forEach(platform => {
                for (let i = 0; i < 6; i++) {
                    products.push({
                        id: id++,
                        name: `Dịch vụ ${platform} - Gói ${['Cơ bản', 'Nâng cao', 'Chuyên nghiệp', 'VIP'][i % 4]}`,
                        category: 'Dịch vụ MXH',
                        type: 'service',
                        price: Math.floor(Math.random() * 2000000) + 50000,
                        oldPrice: Math.floor(Math.random() * 3000000) + 100000,
                        discount: Math.floor(Math.random() * 40) + 5,
                        image: `https://picsum.photos/seed/social${id}/400/300`,
                        rating: (Math.random() * 2 + 3).toFixed(1),
                        sold: Math.floor(Math.random() * 300) + 5,
                        stock: 99,
                        description: `Dịch vụ ${platform} hợp pháp, tuân thủ chính sách nền tảng. Gói ${['Cơ bản', 'Nâng cao', 'Chuyên nghiệp', 'VIP'][i % 4]}.`,
                        badges: i % 2 === 0 ? ['new'] : ['sale']
                    });
                }
            });

            // Digital services
            digitalServices.forEach(service => {
                for (let i = 0; i < 5; i++) {
                    products.push({
                        id: id++,
                        name: `${service} - Gói ${['Tiết kiệm', 'Tiêu chuẩn', 'Cao cấp'][i % 3]}`,
                        category: 'Dịch vụ số',
                        type: 'service',
                        price: Math.floor(Math.random() * 5000000) + 100000,
                        oldPrice: Math.floor(Math.random() * 7000000) + 200000,
                        discount: Math.floor(Math.random() * 30) + 5,
                        image: `https://picsum.photos/seed/digital${id}/400/300`,
                        rating: (Math.random() * 2 + 3).toFixed(1),
                        sold: Math.floor(Math.random() * 200) + 10,
                        stock: 50,
                        description: `Dịch vụ ${service} chuyên nghiệp, uy tín. Gói ${['Tiết kiệm', 'Tiêu chuẩn', 'Cao cấp'][i % 3]}.`,
                        badges: ['sale']
                    });
                }
            });

            return products;
        };

        // Initialize categories from products
        const initCategories = () => {
            const cats = new Set(DB.products.map(p => p.category));
            DB.categories = Array.from(cats).map(c => ({
                name: c,
                icon: c.includes('Game') || c.includes('Liên') || c.includes('Free') || c.includes('PUBG') || c.includes('Valorant') || c.includes('Genshin') || c.includes('Honkai') || c.includes('Wuthering') || c.includes('Minecraft') || c.includes('Roblox') || c.includes('Steam') || c.includes('Epic') || c.includes('PlayStation') || c.includes('Xbox') || c.includes('Nintendo') || c.includes('Đột') ? 'fa-gamepad' : 
                       c.includes('Thẻ') ? 'fa-credit-card' : 
                       c.includes('MXH') ? 'fa-hashtag' : 
                       c.includes('Dịch vụ') ? 'fa-briefcase' : 'fa-box'
            }));
        };

        // Generate products and categories
        DB.products = generateMockProducts();
        initCategories();

        // ==========================================
        // APP CONTROLLER
        // ==========================================
        const app = {
            currentPage: 'home',
            currentProductId: null,
            filterState: { category: 'all', minPrice: 0, maxPrice: 999999999, sort: 'default' },

            init: function() {
                this.updateCartCount();
                this.updateWishlistCount();
                this.render();
                this.setupSearchListener();
                this.setupGlobalListeners();
            },

            setupGlobalListeners: function() {
                // Close modals on overlay click
                document.querySelectorAll('.modal-overlay').forEach(overlay => {
                    overlay.addEventListener('click', (e) => {
                        if (e.target === overlay) {
                            overlay.classList.remove('active');
                        }
                    });
                });
                // Close suggestions on click outside
                document.addEventListener('click', (e) => {
                    const container = document.querySelector('.search-container');
                    if (container && !container.contains(e.target)) {
                        document.getElementById('search-suggestions').classList.remove('active');
                    }
                });
            },

            setupSearchListener: function() {
                const input = document.getElementById('global-search');
                if (!input) return;
                input.addEventListener('input', (e) => {
                    const query = e.target.value.trim();
                    if (query.length < 1) {
                        document.getElementById('search-suggestions').classList.remove('active');
                        return;
                    }
                    const results = DB.products.filter(p => 
                        p.name.toLowerCase().includes(query.toLowerCase()) || 
                        p.category.toLowerCase().includes(query.toLowerCase())
                    ).slice(0, 8);
                    
                    const suggestionsDiv = document.getElementById('search-suggestions');
                    if (results.length === 0) {
                        suggestionsDiv.innerHTML = `<div class="suggestion-item"><div class="info"><h4>Không tìm thấy kết quả</h4><p>Thử tìm với từ khóa khác</p></div></div>`;
                    } else {
                        suggestionsDiv.innerHTML = results.map(p => `
                            <div class="suggestion-item" onclick="app.viewProduct(${p.id})">
                                <img src="${p.image}" alt="${p.name}">
                                <div class="info">
                                    <h4>${p.name}</h4>
                                    <p>${p.category} • ${p.price.toLocaleString('vi-VN')}đ</p>
                                </div>
                            </div>
                        `).join('');
                    }
                    suggestionsDiv.classList.add('active');
                });
            },

            navigate: function(page, param = null) {
                this.currentPage = page;
                if (param) this.currentProductId = param;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                this.render();
            },

            render: function() {
                const root = document.getElementById('app-root');
                switch(this.currentPage) {
                    case 'home': root.innerHTML = this.renderHome(); break;
                    case 'product': root.innerHTML = this.renderProductDetail(this.currentProductId); break;
                    case 'cart': root.innerHTML = this.renderCart(); break;
                    case 'admin': root.innerHTML = this.renderAdmin(); break;
                    case 'search': root.innerHTML = this.renderSearchResults(); break;
                    case 'category': root.innerHTML = this.renderCategoryPage(); break;
                    default: root.innerHTML = this.renderHome();
                }
                this.updateCartCount();
                this.updateWishlistCount();
            },

            // ==========================================
            // HOME PAGE RENDER
            // ==========================================
            renderHome: function() {
                const featured = DB.products.filter(p => p.badges.includes('hot')).slice(0, 10);
                const newProducts = DB.products.filter(p => p.badges.includes('new')).slice(0, 10);
                const bestSellers = [...DB.products].sort((a, b) => b.sold - a.sold).slice(0, 10);
                const saleProducts = DB.products.filter(p => p.discount > 20).slice(0, 10);
                const flashSale = DB.products.filter(p => p.discount > 40).slice(0, 6);

                return `
                <div class="main-wrapper">
                    <!-- Sidebar -->
                    <aside class="sidebar" id="sidebar">
                        <div class="sidebar-category">
                            <h3>Danh Mục Chính</h3>
                            <div class="sidebar-item active" onclick="app.navigate('home')"><i class="fas fa-home"></i> Trang Chủ</div>
                            <div class="sidebar-item" onclick="app.navigate('category')"><i class="fas fa-th-large"></i> Tất Cả Sản Phẩm</div>
                            <div class="sidebar-item" onclick="app.filterCategory('Game')"><i class="fas fa-gamepad"></i> Game</div>
                            <div class="sidebar-item" onclick="app.filterCategory('Thẻ cào')"><i class="fas fa-credit-card"></i> Thẻ Cào</div>
                            <div class="sidebar-item" onclick="app.filterCategory('Dịch vụ MXH')"><i class="fas fa-hashtag"></i> Dịch Vụ MXH</div>
                            <div class="sidebar-item" onclick="app.filterCategory('Dịch vụ số')"><i class="fas fa-briefcase"></i> Dịch Vụ Số</div>
                        </div>
                        <div class="sidebar-category" style="margin-top:20px;">
                            <h3>Game Nổi Bật</h3>
                            ${DB.categories.filter(c => c.icon === 'fa-gamepad').slice(0, 8).map(c => `
                                <div class="sidebar-item" onclick="app.filterCategory('${c.name}')"><i class="fas ${c.icon}"></i> ${c.name} <i class="fas fa-chevron-right arrow"></i></div>
                            `).join('')}
                        </div>
                        <div class="sidebar-category" style="margin-top:20px;">
                            <h3>Hỗ Trợ</h3>
                            <div class="sidebar-item" onclick="app.showToast('Chat hỗ trợ đang được phát triển (DEMO)', 'info')"><i class="fas fa-headset"></i> Chat Hỗ Trợ</div>
                            <div class="sidebar-item" onclick="app.showToast('Trung tâm FAQ (DEMO)', 'info')"><i class="fas fa-question-circle"></i> FAQ</div>
                            <div class="sidebar-item" onclick="app.showToast('Hệ thống ticket (DEMO)', 'info')"><i class="fas fa-ticket-alt"></i> Ticket</div>
                        </div>
                    </aside>

                    <!-- Content -->
                    <main class="content-area">
                        <!-- Hero Banner -->
                        <div class="hero-banner">
                            <div class="hero-content">
                                <h1>Siêu Thị Số <br><span style="color:#fff;text-shadow:0 0 20px rgba(0,212,255,0.8)">Đẳng Cấp Quốc Tế</span></h1>
                                <p>Hàng nghìn sản phẩm, hàng trăm dịch vụ. Tất cả trong một nền tảng duy nhất.</p>
                                <button class="btn btn-primary" onclick="app.navigate('category')"><i class="fas fa-shopping-bag"></i> Khám Phá Ngay</button>
                            </div>
                        </div>

                        <!-- Category Grid -->
                        <div class="section">
                            <div class="section-header"><h2><i class="fas fa-th"></i> Danh Mục Nổi Bật</h2></div>
                            <div class="category-grid">
                                ${DB.categories.slice(0, 12).map(c => `
                                    <div class="category-card" onclick="app.filterCategory('${c.name}')">
                                        <i class="fas ${c.icon}"></i>
                                        <span>${c.name}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Flash Sale -->
                        ${flashSale.length > 0 ? `
                        <div class="section">
                            <div class="flash-sale-bar">
                                <h3><i class="fas fa-bolt"></i> FLASH SALE - Giảm Đến 50%</h3>
                                <div class="countdown" id="flash-countdown">
                                    <span>02</span>:<span>45</span>:<span>30</span>
                                </div>
                            </div>
                            <div class="product-grid">
                                ${flashSale.map(p => this.renderProductCard(p)).join('')}
                            </div>
                        </div>
                        ` : ''}

                        <!-- Featured Products -->
                        <div class="section">
                            <div class="section-header">
                                <h2><i class="fas fa-star"></i> Sản Phẩm Nổi Bật</h2>
                                <span class="view-all" onclick="app.navigate('category')">Xem tất cả <i class="fas fa-arrow-right"></i></span>
                            </div>
                            <div class="product-grid">
                                ${featured.map(p => this.renderProductCard(p)).join('')}
                            </div>
                        </div>

                        <!-- New Products -->
                        <div class="section">
                            <div class="section-header">
                                <h2><i class="fas fa-sparkles"></i> Sản Phẩm Mới</h2>
                                <span class="view-all" onclick="app.navigate('category')">Xem tất cả <i class="fas fa-arrow-right"></i></span>
                            </div>
                            <div class="product-grid">
                                ${newProducts.map(p => this.renderProductCard(p)).join('')}
                            </div>
                        </div>

                        <!-- Best Sellers -->
                        <div class="section">

            // ==========================================
            renderSearchResults: function() {
                const query = document.getElementById('global-search')?.value || '';
                return this.renderCategoryPage(query);
            },

            renderCategoryPage: function(searchQuery = '') {
                let filtered = DB.products;
                if (this.filterState.category !== 'all') {
                    filtered = filtered.filter(p => p.category === this.filterState.category);
                }
                if (searchQuery) {
                    filtered = filtered.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
                }
                filtered = filtered.filter(p => p.price >= this.filterState.minPrice && p.price <= this.filterState.maxPrice);
                
                if (this.filterState.sort === 'price-asc') filtered.sort((a,b) => a.price - b.price);
                else if (this.filterState.sort === 'price-desc') filtered.sort((a,b) => b.price - a.price);
                else if (this.filterState.sort === 'newest') filtered.sort((a,b) => b.id - a.id);
                else if (this.filterState.sort === 'bestseller') filtered.sort((a,b) => b.sold - a.sold);

                return `
                <div class="container" style="padding:30px 20px;">
                    <h1 style="margin-bottom:20px;"><i class="fas fa-search"></i> ${searchQuery ? `Kết quả cho: "${searchQuery}"` : this.filterState.category === 'all' ? 'Tất Cả Sản Phẩm' : this.filterState.category} (${filtered.length})</h1>
                    
                    <!-- Filters -->
                    <div class="glass" style="padding:15px 20px;border-radius:var(--radius-md);margin-bottom:25px;display:flex;flex-wrap:wrap;gap:15px;align-items:center;">
                        <select onchange="app.setFilter('category', this.value)" style="padding:8px 15px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-color);border-radius:6px;">
                            <option value="all" ${this.filterState.category === 'all' ? 'selected' : ''}>Tất cả danh mục</option>
                            ${DB.categories.map(c => `<option value="${c.name}" ${this.filterState.category === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}
                        </select>
                        <select onchange="app.setFilter('sort', this.value)" style="padding:8px 15px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-color);border-radius:6px;">
                            <option value="default">Sắp xếp mặc định</option>
                            <option value="price-asc" ${this.filterState.sort === 'price-asc' ? 'selected' : ''}>Giá tăng dần</option>
                            <option value="price-desc" ${this.filterState.sort === 'price-desc' ? 'selected' : ''}>Giá giảm dần</option>
                            <option value="newest" ${this.filterState.sort === 'newest' ? 'selected' : ''}>Mới nhất</option>
                            <option value="bestseller" ${this.filterState.sort === 'bestseller' ? 'selected' : ''}>Bán chạy</option>
                        </select>
                        <div style="display:flex;gap:10px;align-items:center;">
                            <span style="font-size:0.85rem;color:var(--text-muted);">Giá:</span>
                            <input type="number" placeholder="Từ" value="${this.filterState.minPrice || ''}" onchange="app.setFilter('minPrice', this.value)" style="width:100px;padding:8px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-color);border-radius:6px;">
                            <span>-</span>
                            <input type="number" placeholder="Đến" value="${this.filterState.maxPrice === 999999999 ? '' : this.filterState.maxPrice}" onchange="app.setFilter('maxPrice', this.value)" style="width:120px;padding:8px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-color);border-radius:6px;">
                        </div>
                        <button class="btn btn-sm btn-outline" onclick="app.resetFilters()">Xóa bộ lọc</button>
                    </div>

                    <div class="product-grid">
                        ${filtered.map(p => this.renderProductCard(p)).join('')}
                    </div>
                    ${filtered.length === 0 ? '<div style="text-align:center;padding:50px;color:var(--text-muted);"><i class="fas fa-search" style="font-size:3rem;margin-bottom:15px;"></i><h3>Không tìm thấy sản phẩm nào</h3></div>' : ''}
                </div>
                `;
            },

            setFilter: function(key, value) {
                if (key === 'minPrice') this.filterState.minPrice = Number(value) || 0;
                else if (key === 'maxPrice') this.filterState.maxPrice = Number(value) || 999999999;
                else this.filterState[key] = value;
                this.navigate('category');
            },

            resetFilters: function() {
                this.filterState = { category: 'all', minPrice: 0, maxPrice: 999999999, sort: 'default' };
                this.navigate('category');
            },

            filterCategory: function(cat) {
                this.filterState.category = cat;
                this.navigate('category');
            },

            search: function() {
                const query = document.getElementById('global-search').value.trim();
                if (query) {
                    this.navigate('search');
                    document.getElementById('search-suggestions').classList.remove('active');
                }
            },

                        <div class="admin-nav-item" onclick="app.showToast('Quản lý tài chính (DEMO)', 'info')"><i class="fas fa-wallet"></i> Tài Chính</div>
                        <div class="admin-nav-item" onclick="app.showToast('Quản lý nội dung (DEMO)', 'info')"><i class="fas fa-edit"></i> Nội Dung</div>
                        <div class="admin-nav-item" onclick="app.showToast('Cài đặt (DEMO)', 'info')"><i class="fas fa-cog"></i> Cài Đặt</div>
                        <div class="admin-nav-item" style="margin-top:auto;color:#ef4444;" onclick="app.navigate('home')"><i class="fas fa-sign-out-alt"></i> Thoát Admin</div>
                    </aside>
                    <div class="admin-content">
                        <div class="admin-header">
                            <h1>Dashboard Tổng Quan</h1>
                            <div style="font-size:0.85rem;color:var(--text-muted);">Xin chào, <strong style="color:var(--neon-blue);">Admin</strong></div>
                        </div>
                        <div class="stat-cards">
                            <div class="stat-card">
                                <div class="icon" style="background:rgba(0,212,255,0.1);color:var(--neon-blue);"><i class="fas fa-dollar-sign"></i></div>
                                <div class="value">${totalRevenue.toLocaleString('vi-VN')}đ</div>
                                <div class="label">Tổng Doanh Thu</div>
                            </div>
                            <div class="stat-card">
                                <div class="icon" style="background:rgba(168,85,247,0.1);color:var(--neon-purple);"><i class="fas fa-shopping-bag"></i></div>
                                <div class="value">${totalOrders}</div>
                                <div class="label">Tổng Đơn Hàng</div>
                            </div>
                            <div class="stat-card">
                                <div class="icon" style="background:rgba(236,72,153,0.1);color:var(--neon-pink);"><i class="fas fa-users"></i></div>
                                <div class="value">${totalUsers}</div>
                                <div class="label">Tổng Khách Hàng</div>
                            </div>
                            <div class="stat-card">
                                <div class="icon" style="background:rgba(16,185,129,0.1);color:#10b981;"><i class="fas fa-box"></i></div>
                                <div class="value">${totalProducts}</div>
                                <div class="label">Tổng Sản Phẩm</div>
                            </div>
                        </div>

                        <h2 style="margin-bottom:15px;">Đơn Hàng Gần Đây</h2>
                        <table>
                            <thead><tr><th>Mã Đơn</th><th>Khách Hàng</th><th>Sản Phẩm</th><th>Tổng Tiền</th><th>Trạng Thái</th><th>Ngày</th></tr></thead>
                            <tbody>
                                ${DB.orders.slice(-5).reverse().map(o => `
                                    <tr>
                                        <td>#${o.id}</td>
                                        <td>${o.user}</td>
                                        <td>${o.items} sản phẩm</td>
                                        <td style="color:var(--neon-blue);font-weight:600;">${o.total.toLocaleString('vi-VN')}đ</td>
                                        <td><span class="badge badge-new">Hoàn thành</span></td>
                                        <td>${o.date}</td>
                                    </tr>
                                `).join('')}
                                ${DB.orders.length === 0 ? '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);">Chưa có đơn hàng nào</td></tr>' : ''}
                            </tbody>
                        </table>

                        <h2 style="margin:30px 0 15px;">Sản Phẩm Bán Chạy</h2>
                        <table>
                            <thead><tr><th>ID</th><th>Tên Sản Phẩm</th><th>Danh Mục</th><th>Giá</th><th>Đã Bán</th><th>Tồn Kho</th></tr></thead>
                            <tbody>
                                ${[...DB.products].sort((a,b) => b.sold - a.sold).slice(0, 5).map(p => `
                                    <tr>
                                        <td>#${p.id}</td>
                                        <td>${p.name}</td>
                                        <td>${p.category}</td>
                                        <td style="color:var(--neon-blue);">${p.price.toLocaleString('vi-VN')}đ</td>
                                        <td>${p.sold}</td>
                                        <td>${p.stock}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
                `;
            },

            // ==========================================
            // CART ACTIONS
            // ==========================================
            addToCart: function(productId) {
                const existing = DB.cart.find(item => item.id === productId);
                if (existing) {
                    existing.qty += 1;
                } else {
                    DB.cart.push({ id: productId, qty: 1 });
                }
                saveUserData();
                this.updateCartCount();
                this.showToast('Đã thêm vào giỏ hàng!', 'success');
            },

            removeFromCart: function(productId) {
                DB.cart = DB.cart.filter(item => item.id !== productId);
                saveUserData();
                this.render();
                this.updateCartCount();
                this.showToast('Đã xóa sản phẩm khỏi giỏ hàng', 'info');
            },

            updateCartQty: function(productId, delta) {
                const item = DB.cart.find(i => i.id === productId);
                if (item) {
                    item.qty += delta;
                    if (item.qty <= 0) {
                        this.removeFromCart(productId);
                        return;
                    }
                }
                saveUserData();
                this.render();
                this.updateCartCount();
            },

            updateCartCount: function() {
                const count = DB.cart.reduce((sum, item) => sum + item.qty, 0);
                const el = document.getElementById('cart-count');
                if (el) el.textContent = count;
            },

            updateWishlistCount: function() {
                const el = document.getElementById('wishlist-count');
                if (el) el.textContent = DB.wishlist.length;
            },

            buyNow: function(productId) {
                this.addToCart(productId);
                this.navigate('cart');
            },

            checkout: function() {
                if (!DB.currentUser) {
                    this.showToast('Vui lòng đăng nhập để thanh toán!', 'error');
                    this.showAuthModal();
                    return;
                }
                const total = DB.cart.reduce((sum, item) => {
                    const p = DB.products.find(x => x.id === item.id);
                    return sum + p.price * item.qty;
                }, 0);

                if (DB.walletBalance < total) {
                    this.showToast('Số dư ví không đủ! Vui lòng nạp thêm. (DEMO)', 'error');
                    return;
                }

                DB.walletBalance -= total;
                const order = {
                    id: 'ORD' + Date.now(),
                    user: DB.currentUser.email,
                    items: DB.cart.length,
                    total: total,
                    date: new Date().toLocaleDateString('vi-VN'),
                    status: 'completed'
                };
                DB.orders.push(order);
                DB.cart = [];
                saveUserData();
                this.updateCartCount();
                this.render();
                this.showToast('Thanh toán thành công! (DEMO - Không giao dịch thật)', 'success');
            },

            // ==========================================
            // WISHLIST ACTIONS
            // ==========================================
            toggleWishlist: function(productId, btn) {
                const idx = DB.wishlist.indexOf(productId);
                if (idx > -1) {
                    DB.wishlist.splice(idx, 1);
                    if (btn) btn.classList.remove('active');
                    this.showToast('Đã xóa khỏi yêu thích', 'info');
                } else {
                    DB.wishlist.push(productId);
                    if (btn) btn.classList.add('active');
                    this.showToast('Đã thêm vào yêu thích', 'success');
                }
                saveUserData();
                this.updateWishlistCount();
            },

            showWishlist: function() {
                if (DB.wishlist.length === 0) {
                    this.showToast('Danh sách yêu thích trống', 'info');
                    return;
                }
                const items = DB.wishlist.map(id => DB.products.find(p => p.id === id)).filter(Boolean);
                const content = document.getElementById('quickview-content');
                content.innerHTML = `
                    <button class="modal-close" onclick="document.getElementById('quickview-modal').classList.remove('active')"><i class="fas fa-times"></i></button>
                    <h2 style="margin-bottom:20px;"><i class="fas fa-heart" style="color:var(--neon-pink);"></i> Danh Sách Yêu Thích (${items.length})</h2>
                    <div style="max-height:500px;overflow-y:auto;">
                        ${items.map(p => `
                            <div style="display:flex;gap:15px;padding:15px;border-bottom:1px solid var(--border-color);cursor:pointer;" onclick="document.getElementById('quickview-modal').classList.remove('active');app.viewProduct(${p.id})">
                                <img src="${p.image}" style="width:70px;height:70px;border-radius:8px;object-fit:cover;">
                                <div>
                                    <h4 style="font-size:0.95rem;">${p.name}</h4>
                                    <div style="color:var(--neon-blue);font-weight:700;">${p.price.toLocaleString('vi-VN')}đ</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                document.getElementById('quickview-modal').classList.add('active');
            },

            viewProduct: function(id) {
                this.navigate('product', id);
            },

            // ==========================================
            // AUTH
            // ==========================================
            showAuthModal: function() {
                if (DB.currentUser) {
                    // Show profile
                    const content = document.getElementById('auth-form-container');
                    content.innerHTML = `
                        <h2>Hồ Sơ Cá Nhân</h2>
                        <div style="text-align:center;margin-bottom:20px;">
                            <div style="width:80px;height:80px;border-radius:50%;background:var(--gradient-main);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:2rem;color:#fff;font-weight:700;">${DB.currentUser.name.charAt(0).toUpperCase()}</div>
                            <h3>${DB.currentUser.name}</h3>
                            <p style="color:var(--text-muted);font-size:0.9rem;">${DB.currentUser.email}</p>
                        </div>
                        <div class="glass" style="padding:15px;border-radius:var(--radius-sm);margin-bottom:15px;">
                            <div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="color:var(--text-muted);">Số dư ví:</span><strong style="color:var(--neon-blue);">${DB.walletBalance.toLocaleString('vi-VN')}đ</strong></div>
                            <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-muted);">Đơn hàng:</span><strong>${DB.orders.filter(o => o.user === DB.currentUser.email).length}</strong></div>
                        </div>
                        <button class="btn btn-primary" style="width:100%;margin-bottom:10px;" onclick="app.showToast('Tính năng nạp tiền DEMO', 'info')"><i class="fas fa-plus-circle"></i> Nạp Tiền (DEMO)</button>
                        <button class="btn btn-danger" style="width:100%;" onclick="app.logout()"><i class="fas fa-sign-out-alt"></i> Đăng Xuất</button>
                    `;
                } else {
                    this.renderAuthForm('login');
                }
                document.getElementById('auth-modal').classList.add('active');
            },

            renderAuthForm: function(type) {
                const content = document.getElementById('auth-form-container');
                if (type === 'login') {
                    content.innerHTML = `
                        <h2>Đăng Nhập</h2>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="auth-email" placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label>Mật Khẩu</label>
                            <input type="password" id="auth-password" placeholder="••••••••">
                        </div>
                        <button class="btn btn-primary" style="width:100%;" onclick="app.login()">Đăng Nhập</button>
                        <div class="auth-switch">Chưa có tài khoản? <span onclick="app.renderAuthForm('register')">Đăng Ký Ngay</span></div>
                    `;
                } else {
                    content.innerHTML = `
                        <h2>Đăng Ký</h2>
                        <div class="form-group">
                            <label>Họ Tên</label>
                            <input type="text" id="auth-name" placeholder="Nguyễn Văn A">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="auth-email" placeholder="your@email.com">
                        </div>
                        <div class="form-group">
                            <label>Mật Khẩu</label>
                            <input type="password" id="auth-password" placeholder="Tối thiểu 6 ký tự">
                        </div>
                        <button class="btn btn-primary" style="width:100%;" onclick="app.register()">Tạo Tài Khoản</button>
                        <div class="auth-switch">Đã có tài khoản? <span onclick="app.renderAuthForm('login')">Đăng Nhập</span></div>
                    `;
                }
            },

            login: function() {
                const email = document.getElementById('auth-email').value.trim();
                const password = document.getElementById('auth-password').value;
                if (!email || !password) { this.showToast('Vui lòng nhập đầy đủ thông tin', 'error'); return; }
                const user = DB.users.find(u => u.email === email && u.password === password);
                if (!user) { this.showToast('Email hoặc mật khẩu không đúng!', 'error'); return; }
                DB.currentUser = user;
                // Load user-specific data
                const userKey = user.email;
                DB.cart = JSON.parse(localStorage.getItem('thshop_cart_' + userKey)) || [];
                DB.wishlist = JSON.parse(localStorage.getItem('thshop_wishlist_' + userKey)) || [];
                DB.walletBalance = JSON.parse(localStorage.getItem('thshop_wallet_' + userKey)) || 500000;
                saveUserData();
                this.closeAuthModal();
                this.render();
                this.showToast(`Chào mừng ${user.name}!`, 'success');
            },

            register: function() {
                const name = document.getElementById('auth-name').value.trim();
                const email = document.getElementById('auth-email').value.trim();
                const password = document.getElementById('auth-password').value;
                if (!name || !email || !password) { this.showToast('Vui lòng nhập đầy đủ thông tin', 'error'); return; }
                if (password.length < 6) { this.showToast('Mật khẩu phải từ 6 ký tự', 'error'); return; }
                if (DB.users.find(u => u.email === email)) { this.showToast('Email đã được đăng ký!', 'error'); return; }
                const user = { name, email, password };
                DB.users.push(user);
                DB.currentUser = user;
                DB.walletBalance = 500000; // Welcome bonus
                saveUserData();
                this.closeAuthModal();
                this.render();
                this.showToast('Đăng ký thành công! Tặng 500.000đ vào ví (DEMO)', 'success');
            },

            logout: function() {
                DB.currentUser = null;
                DB.cart = [];
                DB.wishlist = [];
                saveUserData();
                this.closeAuthModal();
                this.render();
                this.showToast('Đã đăng xuất', 'info');
            },

            closeAuthModal: function() {
                document.getElementById('auth-modal').classList.remove('active');
            },

            // ==========================================
            // UTILITIES
            // ==========================================
            toggleTheme: function() {
                const body = document.body;
                const current = body.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                body.setAttribute('data-theme', next);
                localStorage.setItem('thshop_theme', next);
                document.getElementById('theme-icon').className = next === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            },

            toggleSidebar: function() {
                const sidebar = document.getElementById('sidebar');
                if (sidebar) {
                    sidebar.style.display = sidebar.style.display === 'block' ? 'none' : 'block';
                    sidebar.style.position = 'fixed';
                    sidebar.style.left = '0';
                    sidebar.style.top = '60px';
                    sidebar.style.bottom = '0';
                    sidebar.style.zIndex = '999';
                }
            },

            showToast: function(message, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
                toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> <span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; setTimeout(() => toast.remove(), 300); }, 3500);
            }
        };

        // Load theme
        const savedTheme = localStorage.getItem('thshop_theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'light') document.getElementById('theme-icon').className = 'fas fa-sun';

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

        // Flash sale countdown timer
        setInterval(() => {
            const el = document.getElementById('flash-countdown');
            if (el) {
                const spans = el.querySelectorAll('span');
                let h = parseInt(spans[0].textContent);
                let m = parseInt(spans[2].textContent);
                let s = parseInt(spans[4].textContent);
                s--;
                if (s < 0) { s = 59; m--; }
                if (m < 0) { m = 59; h--; }
                if (h < 0) { h = 23; m = 59; s = 59; }
                spans[0].textContent = String(h).padStart(2, '0');
                spans[2].textContent = String(m).padStart(2, '0');
                spans[4].textContent = String(s).padStart(2, '0');
            }
        }, 1000);
    </script>
</body>
</html>
